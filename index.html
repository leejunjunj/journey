<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 여정 - 스마트 여행 플래너</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI 여정">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/201/201623.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/201/201623.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      background: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.8)), 
                  url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    #map { height: 400px; width: 100%; border-radius: 0.75rem; z-index: 10; }

    /* 위아래 스크롤 휠 피커 스타일 */
    .wheel-picker-container {
      height: 100px;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .wheel-picker-container::-webkit-scrollbar { display: none; }
    .wheel-item {
      height: 33.33px;
      scroll-snap-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen pb-16">

  <!-- 헤더 -->
  <header class="py-6 px-4 text-center text-white shadow-md mb-4">
    <div class="max-w-4xl mx-auto flex justify-center items-center gap-3">
      <img src="https://cdn-icons-png.flaticon.com/512/201/201623.png" class="w-10 h-10 drop-shadow-md" alt="앱 아이콘">
      <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight drop-shadow-md">AI 스마트 여정 플래너</h1>
    </div>
    <p class="text-emerald-200 text-xs md:text-sm mt-1 drop-shadow">시간대별 코스 & 실시간 지능형 예산 최적화</p>
  </header>

  <main class="max-w-4xl mx-auto px-4 space-y-6">

    <!-- 1. 여행 정보 입력 -->
    <section class="glass-card p-6 rounded-2xl shadow-xl border border-white/40 space-y-4">
      <h2 class="text-lg font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
        <i class="fa-solid fa-compass text-teal-600"></i>1. 여행 기본 정보 입력
      </h2>
      
      <!-- 출발지 & 도착지 (군더더기 설명 문구 제거) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-700">출발지</label>
          <input type="text" id="startLocation" class="w-full border rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-teal-500 outline-none bg-white" placeholder="예: 장산역, 서울역, 인천공항 등">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-700">도착지</label>
          <input type="text" id="destinationMain" class="w-full border rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-teal-500 outline-none bg-white" placeholder="예: 장산역, 부산, 제주도 등">
        </div>
      </div>

      <!-- 예산 & 날짜 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-700">총 예산</label>
          <input type="text" id="totalBudgetInput" class="w-full border rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-teal-500 outline-none bg-white" placeholder="예: 20만원, 500000원 등 입력 가능">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-700">여행 일정</label>
          <div class="flex items-center gap-1 text-xs">
            <input type="date" id="startDate" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none bg-white">
            <span>~</span>
            <input type="date" id="endDate" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none bg-white">
          </div>
        </div>
      </div>

      <!-- 인원수 스크롤 선택기 (1~30명) -->
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-700">여행 인원 수 (위아래로 드래그/스크롤하여 선택)</label>
        <div class="relative bg-slate-100 rounded-xl border border-slate-300 overflow-hidden">
          <div class="absolute inset-x-0 top-[33.33px] h-[33.33px] bg-teal-500/20 border-y border-teal-500 pointer-events-none"></div>
          <div class="wheel-picker-container" id="wheelPicker" onscroll="onWheelScroll()">
            <div class="wheel-item"></div>
            <script>
              for(let i=1; i<=30; i++) {
                document.write(`<div class="wheel-item font-bold text-sm" data-val="${i}">${i} 명</div>`);
              }
            </script>
            <div class="wheel-item"></div>
          </div>
        </div>
      </div>

      <!-- 세부 여행지 추가 -->
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-700">세부 방문하고 싶은 곳 / 지역 (Enter 입력 시 추가)</label>
        <div class="flex gap-2">
          <input type="text" id="destinationInput" class="flex-1 border rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-teal-500 outline-none bg-white" placeholder="예: 부산, 거제, 광안리 (입력 후 Enter)" onkeydown="handleDestKeyDown(event)">
          <button type="button" onclick="addDestination()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-4 py-2.5 rounded-lg font-bold transition">추가</button>
        </div>
        <div id="destinationTags" class="flex flex-wrap gap-2 mt-2"></div>
      </div>

      <!-- 여행 스타일 선택 -->
      <div>
        <label class="block text-xs font-semibold mb-2 text-slate-700">선호 스타일 (다중 선택)</label>
        <div class="flex flex-wrap gap-2" id="styleTags">
          <button type="button" data-style="식도락" class="style-tag px-3.5 py-1.5 rounded-full border text-xs font-medium bg-white text-slate-700 border-slate-300">🍜 식도락</button>
          <button type="button" data-style="경치/자연" class="style-tag px-3.5 py-1.5 rounded-full border text-xs font-medium bg-white text-slate-700 border-slate-300">🏔️ 경치 & 자연</button>
          <button type="button" data-style="로컬체험" class="style-tag px-3.5 py-1.5 rounded-full border text-xs font-medium bg-white text-slate-700 border-slate-300">🏘️ 로컬 탐방</button>
          <button type="button" data-style="운동/액티비티" class="style-tag px-3.5 py-1.5 rounded-full border text-xs font-medium bg-white text-slate-700 border-slate-300">🏃 운동 & 액티비티</button>
          <button type="button" data-style="여유/휴식" class="style-tag px-3.5 py-1.5 rounded-full border text-xs font-medium bg-white text-slate-700 border-slate-300">☕ 힐링 & 여유</button>
        </div>
      </div>

      <button id="generateBtn" onclick="fetchAIItinerary()" class="w-full bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i> AI 코스 짜기
      </button>
    </section>

    <!-- 로딩 스피너 -->
    <div id="loading" class="hidden glass-card p-8 rounded-2xl text-center">
      <i class="fa-solid fa-spinner fa-spin text-4xl text-teal-600 mb-3"></i>
      <p class="text-sm font-bold text-slate-800">Gemini AI가 시간대별 동선과 예산을 분석해 최적의 코스를 만드는 중입니다...</p>
    </div>

    <!-- 지도 섹션 -->
    <section class="glass-card p-6 rounded-2xl shadow-xl border border-white/40">
      <h2 class="text-lg font-bold mb-3 text-slate-900 border-b pb-2 flex items-center gap-2">
        <i class="fa-solid fa-map-location-dot text-teal-600"></i>2. 동선 지도
      </h2>
      <div id="map"></div>
    </section>

    <!-- AI 추천 장소 리스트 (DAY 구분 및 레이아웃 수정) -->
    <section id="recommendationSection" class="glass-card p-6 rounded-2xl shadow-xl border border-white/40 hidden">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 pb-2 border-b gap-3">
        <h2 class="text-lg font-bold text-slate-900"><i class="fa-solid fa-list-check mr-2 text-teal-600"></i>3. AI 추천 장소 리스트</h2>
        
        <div class="flex flex-wrap gap-2">
          <button onclick="toggleSelectAll()" class="px-2.5 py-1 bg-white hover:bg-slate-100 text-slate-700 text-xs font-semibold rounded border shadow-sm">전체 선택/해제</button>
          <button onclick="deleteChecked()" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold rounded border border-rose-200">선택 삭제</button>
          <button onclick="confirmPlaces()" class="px-3 py-1 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded shadow">시간대별 일정표 생성</button>
        </div>
      </div>

      <div id="placeListContainer" class="space-y-6"></div>
    </section>

    <!-- 날짜별 확정 일정표 -->
    <section id="finalScheduleSection" class="glass-card p-6 rounded-2xl shadow-xl border border-white/40 hidden">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 border-b pb-3 gap-3">
        <div>
          <h2 class="text-xl font-bold text-slate-900"><i class="fa-solid fa-calendar-days mr-2 text-teal-600"></i>4. 시간대별 최종 일정표</h2>
          <div id="totalBudgetSummary" class="mt-1 text-xs text-teal-800 font-bold bg-teal-50 px-2.5 py-1 rounded inline-block border border-teal-200"></div>
        </div>

        <div class="flex flex-wrap gap-2">
          <button onclick="shareKakao()" class="px-3 py-1.5 bg-yellow-400 hover:bg-yellow-500 text-slate-900 text-xs font-bold rounded shadow-sm flex items-center gap-1"><i class="fa-solid fa-comment"></i> 카톡/링크 공유</button>
          <button onclick="downloadAsImage()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded shadow-sm flex items-center gap-1"><i class="fa-solid fa-download"></i> 이미지 저장</button>
        </div>
      </div>

      <div id="downloadArea" class="p-4 bg-white/90 rounded-xl space-y-4">
        <div id="dayByDaySchedule" class="space-y-6"></div>
      </div>
    </section>

    <!-- 준비물 체크리스트 -->
    <section id="packingListSection" class="glass-card p-6 rounded-2xl shadow-xl border border-white/40 hidden">
      <h2 class="text-md font-bold mb-3 text-slate-900 border-b pb-2"><i class="fa-solid fa-boxes-packing mr-2 text-teal-600"></i>5. 여행 필수 준비물 체크리스트</h2>
      <div class="flex gap-2 mb-4">
        <input type="text" id="newPackingItem" class="flex-1 border rounded p-2 text-xs focus:ring-2 focus:ring-teal-500 outline-none bg-white" placeholder="추가할 준비물 입력">
        <button onclick="addCustomPackingItem()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold px-4 py-2 rounded">추가</button>
      </div>
      <div id="packingListContainer" class="grid grid-cols-2 md:grid-cols-3 gap-3 text-xs"></div>
    </section>

  </main>

  <script>
    const FIXED_API_KEY = "AQ.Ab8RN6K3nkgnYje2mSpkemDglSMq3jMwdZ2-dEN1HGPxS_Dtng";

    let map;
    let markers = [];
    let selectedStyles = [];
    let destinationList = [];
    let generatedPlaces = [];
    let selectedTravelers = 2;
    let packingItems = ["여권/신분증", "보조배터리/충전기", "비상약", "세면도구", "편한 신발"];

    function initApp() {
      map = L.map('map').setView([36.5, 127.5], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      setTimeout(() => {
        const picker = document.getElementById('wheelPicker');
        picker.scrollTop = 33.33; 
      }, 100);

      loadFromLocalStorage();
    }
    window.onload = initApp;

    function onWheelScroll() {
      const picker = document.getElementById('wheelPicker');
      const idx = Math.round(picker.scrollTop / 33.33);
      if (idx >= 0 && idx < 30) {
        selectedTravelers = idx + 1;
        saveToLocalStorage();
      }
    }

    function parseKRWBudget(text) {
      if (!text) return 0;
      let clean = text.toString().replace(/,/g, '').trim();
      let total = 0;
      const ukMatch = clean.match(/(\d+)\s*억/);
      const manMatch = clean.match(/(\d+)\s*만/);

      if (ukMatch) total += parseInt(ukMatch[1]) * 100000000;
      if (manMatch) total += parseInt(manMatch[1]) * 10000;

      if (!ukMatch && !manMatch) {
        const nums = clean.replace(/[^0-9]/g, '');
        if (nums) total = parseInt(nums);
      }
      return total;
    }

    function handleDestKeyDown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addDestination();
      }
    }

    function addDestination() {
      const input = document.getElementById('destinationInput');
      const val = input.value.trim();
      if(val && !destinationList.includes(val)) {
        destinationList.push(val);
        input.value = '';
        renderDestinationTags();
        saveToLocalStorage();
      }
    }

    function removeDestination(index) {
      destinationList.splice(index, 1);
      renderDestinationTags();
      saveToLocalStorage();
    }

    function renderDestinationTags() {
      const container = document.getElementById('destinationTags');
      container.innerHTML = destinationList.map((dest, i) => `
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-teal-100 text-teal-800 text-xs font-bold shadow-sm">
          ${dest}
          <button type="button" onclick="removeDestination(${i})" class="text-teal-600 hover:text-teal-900 font-extrabold ml-1">×</button>
        </span>
      `).join('');
    }

    document.querySelectorAll('.style-tag').forEach(tag => {
      tag.addEventListener('click', function() {
        const style = this.dataset.style;
        if (selectedStyles.includes(style)) {
          selectedStyles = selectedStyles.filter(s => s !== style);
          this.classList.remove('bg-teal-600', 'text-white');
          this.classList.add('bg-white', 'text-slate-700');
        } else {
          selectedStyles.push(style);
          this.classList.remove('bg-white', 'text-slate-700');
          this.classList.add('bg-teal-600', 'text-white');
        }
        saveToLocalStorage();
      });
    });

    async function fetchAIItinerary() {
      const startLoc = document.getElementById('startLocation').value.trim();
      const mainDest = document.getElementById('destinationMain').value.trim();

      if (!startLoc || !mainDest) {
        alert("출발지와 도착지를 입력해 주세요.");
        return;
      }

      const rawBudget = document.getElementById('totalBudgetInput').value;
      const numericBudget = parseKRWBudget(rawBudget);
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;

      document.getElementById('loading').classList.remove('hidden');

      const prompt = `
        출발지: ${startLoc}
        도착지: ${mainDest}
        방문 희망 지역들: ${destinationList.join(', ')}
        일정: ${startDate} ~ ${endDate}
        인원: ${selectedTravelers}명
        총 예산 입력값: "${rawBudget}" (${numericBudget}원)
        선호 스타일: ${selectedStyles.join(', ')}

        [지침]
        1. 입력된 예산 범위 안에서 시간대별(오전, 점심, 오후, 저녁) 코스를 구체적으로 구성해줘.
        2. 오타가 있더라도 문맥을 통해 알아서 올바른 지명으로 파악해줘.
        3. 반드시 아래 JSON 형식으로만 응답해줘.

        {
          "isPossible": true,
          "message": "",
          "places": [
            {
              "id": 1,
              "day": 1,
              "timeSlot": "09:30 - 11:00",
              "type": "attraction 또는 restaurant 또는 accommodation",
              "category": "명소 또는 식당 또는 숙소",
              "name": "장소명",
              "lat": 위도숫자,
              "lng": 경도숫자,
              "details": "주요 설명 또는 메뉴 정보",
              "cost": 1인당예상비용숫자
            }
          ]
        }
      `;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${FIXED_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        if(data.error) throw new Error(data.error.message);

        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();

        const result = JSON.parse(rawText);
        document.getElementById('loading').classList.add('hidden');

        generatedPlaces = result.places || [];
        generatedPlaces.forEach(p => p.checked = true);

        document.getElementById('recommendationSection').classList.remove('hidden');
        renderPlaceList();
        updateMapMarkers(generatedPlaces);
        saveToLocalStorage();

        setTimeout(() => { map.invalidateSize(); }, 200);

      } catch (err) {
        console.error(err);
        alert("코스 생성 실패: " + err.message);
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function updateMapMarkers(places) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      const bounds = [];

      places.forEach(place => {
        if(place.lat && place.lng) {
          const marker = L.marker([place.lat, place.lng]).addTo(map)
            .bindPopup(`<b>${place.name}</b><br>${place.timeSlot || ''}`);
          markers.push(marker);
          bounds.push([place.lat, place.lng]);
        }
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50] });
      }
    }

    // 추천 리스트 렌더링 (DAY 구분 및 상단 시간 박스 배치 적용)
    function renderPlaceList() {
      const container = document.getElementById('placeListContainer');
      container.innerHTML = '';

      const grouped = {};
      generatedPlaces.forEach(p => {
        const day = p.day || 1;
        if(!grouped[day]) grouped[day] = [];
        grouped[day].push(p);
      });

      Object.keys(grouped).sort((a, b) => a - b).forEach(day => {
        const daySection = document.createElement('div');
        daySection.className = "space-y-3";

        let dayHeader = `
          <div class="flex items-center gap-2 pb-1 border-b border-teal-200">
            <span class="font-bold text-teal-800 text-sm bg-teal-100 px-2.5 py-0.5 rounded-md"><i class="fa-regular fa-calendar-check mr-1"></i> DAY ${day}</span>
          </div>
        `;

        let cardsHTML = grouped[day].map(place => {
          const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name)}`;
          return `
            <div class="p-4 rounded-2xl border border-slate-200 bg-white shadow-sm space-y-2 text-xs">
              <!-- Checkbox & Time Slot Header -->
              <div class="flex items-center gap-2">
                <input type="checkbox" class="w-4 h-4 cursor-pointer accent-teal-600" ${place.checked ? 'checked' : ''} onchange="toggleCheck(${place.id})">
                <span class="font-bold px-3 py-1 rounded-lg bg-emerald-100 text-emerald-800 text-xs shadow-xs">${place.timeSlot || '시간 미정'}</span>
              </div>

              <!-- Main Info Area -->
              <div class="pl-6 pt-1 space-y-1">
                <div class="flex items-center justify-between gap-2">
                  <strong class="text-sm md:text-base text-slate-800 font-extrabold">${place.name}</strong>
                  <div class="flex items-center gap-2 whitespace-nowrap">
                    <span class="text-slate-500 font-semibold">₩${(place.cost||0).toLocaleString()}원</span>
                    <a href="${mapUrl}" target="_blank" class="text-teal-600 hover:text-teal-800 font-bold whitespace-nowrap flex items-center gap-0.5"><i class="fa-solid fa-location-dot"></i> 지도</a>
                  </div>
                </div>
                <p class="text-slate-600 text-xs leading-relaxed">${place.details || ''}</p>
              </div>
            </div>
          `;
        }).join('');

        daySection.innerHTML = dayHeader + `<div class="space-y-3 mt-2">${cardsHTML}</div>`;
        container.appendChild(daySection);
      });
    }

    function toggleCheck(id) {
      const item = generatedPlaces.find(p => p.id === id);
      if(item) item.checked = !item.checked;
      saveToLocalStorage();
    }

    function toggleSelectAll() {
      const allChecked = generatedPlaces.every(p => p.checked);
      generatedPlaces.forEach(p => p.checked = !allChecked);
      renderPlaceList();
      saveToLocalStorage();
    }

    function deleteChecked() {
      generatedPlaces = generatedPlaces.filter(p => !p.checked);
      renderPlaceList();
      updateMapMarkers(generatedPlaces);
      saveToLocalStorage();
    }

    function confirmPlaces() {
      const finalSection = document.getElementById('finalScheduleSection');
      const container = document.getElementById('dayByDaySchedule');
      const packingSection = document.getElementById('packingListSection');

      finalSection.classList.remove('hidden');
      packingSection.classList.remove('hidden');
      container.innerHTML = '';

      let totalExpense = 0;
      const grouped = {};

      generatedPlaces.filter(p => p.checked).forEach(p => {
        const day = p.day || 1;
        if(!grouped[day]) grouped[day] = [];
        grouped[day].push(p);
      });

      Object.keys(grouped).forEach(day => {
        const dayBox = document.createElement('div');
        dayBox.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2";

        let dayCost = 0;
        let itemsHTML = grouped[day].map(item => {
          dayCost += (item.cost || 0);
          const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name)}`;

          return `
            <div class="py-2 border-b last:border-b-0 flex justify-between items-center text-xs">
              <div class="flex items-center gap-2">
                <span class="font-bold text-teal-700 bg-teal-50 px-2 py-0.5 rounded whitespace-nowrap">${item.timeSlot || '시간'}</span>
                <strong class="text-slate-800">${item.name}</strong>
              </div>
              <div class="flex items-center gap-3 whitespace-nowrap">
                <span class="text-slate-500">₩${(item.cost||0).toLocaleString()}원</span>
                <a href="${mapUrl}" target="_blank" class="text-teal-600 hover:underline font-semibold whitespace-nowrap">지도보기</a>
              </div>
            </div>
          `;
        }).join('');

        totalExpense += dayCost;

        dayBox.innerHTML = `
          <div class="flex justify-between items-center pb-2 border-b">
            <h3 class="font-bold text-teal-800 text-sm"><i class="fa-regular fa-calendar-check mr-1"></i> DAY ${day}</h3>
            <span class="text-xs font-bold text-slate-600">예상 1인 비용: ₩${dayCost.toLocaleString()}원</span>
          </div>
          <div>${itemsHTML}</div>
        `;
        container.appendChild(dayBox);
      });

      const grandTotal = totalExpense * selectedTravelers;
      document.getElementById('totalBudgetSummary').innerHTML = `전체 인원(${selectedTravelers}명) 총 예상 비용: 약 ₩${grandTotal.toLocaleString()}원`;

      renderPackingList();
      window.scrollTo({ top: finalSection.offsetTop - 20, behavior: 'smooth' });
    }

    function shareKakao() {
      navigator.clipboard.writeText(window.location.href);
      alert("일정 링크가 복사되었습니다! 원하시는 곳에 붙여넣기 하여 공유하세요.");
    }

    function downloadAsImage() {
      html2canvas(document.getElementById('downloadArea')).then(canvas => {
        const link = document.createElement('a');
        link.download = 'ai-travel-plan.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    function renderPackingList() {
      const container = document.getElementById('packingListContainer');
      container.innerHTML = '';
      packingItems.forEach(item => {
        const div = document.createElement('div');
        div.className = "flex items-center gap-2 p-2 rounded border bg-white shadow-sm";
        div.innerHTML = `<input type="checkbox" class="w-4 h-4 cursor-pointer"><span class="text-slate-700">${item}</span>`;
        container.appendChild(div);
      });
    }

    function addCustomPackingItem() {
      const input = document.getElementById('newPackingItem');
      const val = input.value.trim();
      if(val && !packingItems.includes(val)) {
        packingItems.push(val);
        renderPackingList();
        input.value = '';
        saveToLocalStorage();
      }
    }

    function saveToLocalStorage() {
      const data = {
        startLocation: document.getElementById('startLocation').value,
        destinationMain: document.getElementById('destinationMain').value,
        totalBudgetInput: document.getElementById('totalBudgetInput').value,
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        selectedTravelers,
        destinationList,
        selectedStyles,
        generatedPlaces,
        packingItems
      };
      localStorage.setItem('ai_travel_data_saved', JSON.stringify(data));
    }

    function loadFromLocalStorage() {
      const saved = localStorage.getItem('ai_travel_data_saved');
      if(!saved) return;
      try {
        const data = JSON.parse(saved);
        if(data.startLocation) document.getElementById('startLocation').value = data.startLocation;
        if(data.destinationMain) document.getElementById('destinationMain').value = data.destinationMain;
        if(data.totalBudgetInput) document.getElementById('totalBudgetInput').value = data.totalBudgetInput;
        if(data.startDate) document.getElementById('startDate').value = data.startDate;
        if(data.endDate) document.getElementById('endDate').value = data.endDate;
        if(data.destinationList) { destinationList = data.destinationList; renderDestinationTags(); }
        if(data.selectedStyles) {
          selectedStyles = data.selectedStyles;
          document.querySelectorAll('.style-tag').forEach(tag => {
            if(selectedStyles.includes(tag.dataset.style)) {
              tag.classList.remove('bg-white', 'text-slate-700');
              tag.classList.add('bg-teal-600', 'text-white');
            }
          });
        }
        if(data.generatedPlaces && data.generatedPlaces.length > 0) {
          generatedPlaces = data.generatedPlaces;
          document.getElementById('recommendationSection').classList.remove('hidden');
          renderPlaceList();
          updateMapMarkers(generatedPlaces);
        }
        if(data.packingItems) { packingItems = data.packingItems; renderPackingList(); }
      } catch(e) { console.error(e); }
    }
  </script>
</body>
</html>
