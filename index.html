<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 여정 - 스마트 여행 플래너</title>
  
  <!-- 모바일 홈 화면 앱(PWA) 아이콘 & 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI 여정">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/201/201623.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/201/201623.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- FontAwesome 아이콘 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      background: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.8)), 
                  url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    #map { height: 420px; width: 100%; border-radius: 0.75rem; z-index: 10; }
  </style>
</head>
<body class="text-slate-800 min-h-screen pb-16">

  <!-- 헤더 -->
  <header class="py-6 px-4 text-center text-white shadow-md mb-4">
    <div class="max-w-4xl mx-auto flex justify-center items-center gap-3">
      <img src="https://cdn-icons-png.flaticon.com/512/201/201623.png" class="w-10 h-10 drop-shadow-md" alt="앱 아이콘">
      <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight drop-shadow-md">AI 스마트 여정 플래너</h1>
    </div>
    <p class="text-emerald-200 text-xs md:text-sm mt-1 drop-shadow">실시간 Gemini AI 기반 시간대별 코스 및 예산 최적화</p>
  </header>

  <main class="max-w-4xl mx-auto px-4 space-y-6">

    <!-- 1. 여행 정보 입력 -->
    <section class="glass-card p-6 rounded-2xl shadow-xl border border-white/40 space-y-4">
      <h2 class="text-lg font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
        <i class="fa-solid fa-compass text-teal-600"></i>1. 출발지 및 여행 기본 정보 설정
      </h2>
      
      <!-- 출발지 및 예산 금액 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-700">출발지 (어디서 출발하시나요?)</label>
          <input type="text" id="startLocation" class="w-full border rounded-lg p-2 text-xs focus:ring-2 focus:ring-teal-500 outline-none bg-white" placeholder="예: 서울 자택, 부산역 등">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-700">총 보유 예산 (원)</label>
          <input type="number" id="totalBudget" step="10000" class="w-full border rounded-lg p-2 text-xs focus:ring-2 focus:ring-teal-500 outline-none bg-white" placeholder="예: 500000 (원 단위 입력)">
        </div>
      </div>

      <!-- 여행 일정 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-700">여행 일정</label>
          <div class="flex items-center gap-1 text-xs">
            <input type="date" id="startDate" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none bg-white">
            <span>~</span>
            <input type="date" id="endDate" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none bg-white">
          </div>
        </div>
        <!-- 인원 수 슬라이더 -->
        <div>
          <div class="flex justify-between text-xs font-semibold mb-1 text-slate-700">
            <span>여행 인원 수</span>
            <span class="text-teal-600 font-bold" id="travelerCountText">2 명</span>
          </div>
          <input type="range" id="travelers" min="1" max="20" value="2" class="w-full accent-teal-600 cursor-pointer mt-2" oninput="document.getElementById('travelerCountText').innerText = this.value + ' 명'">
        </div>
      </div>

      <!-- 여행지 엔터 태그 추가 & 개별 삭제 -->
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-700">도착 여행지 (도시/장소 적고 Enter)</label>
        <div class="flex gap-2">
          <input type="text" id="destinationInput" class="flex-1 border rounded-lg p-2 text-xs focus:ring-2 focus:ring-teal-500 outline-none bg-white" placeholder="예: 부산 (입력 후 Enter)" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); addDestination(); }">
          <button type="button" onclick="addDestination()" class="bg-teal-600 text-white text-xs px-3 py-2 rounded-lg font-bold">추가</button>
        </div>
        <!-- 추가된 여행지 태그 영역 -->
        <div id="destinationTags" class="flex flex-wrap gap-2 mt-2"></div>
      </div>

      <!-- 여행 스타일 선택 -->
      <div>
        <label class="block text-xs font-semibold mb-2 text-slate-700">선호 스타일 (다중 선택)</label>
        <div class="flex flex-wrap gap-2" id="styleTags">
          <button type="button" data-style="식도락" class="style-tag px-3 py-1.5 rounded-full border text-xs font-medium bg-white text-slate-700 border-slate-300">🍜 식도락</button>
          <button type="button" data-style="경치/자연" class="style-tag px-3 py-1.5 rounded-full border text-xs font-medium bg-white text-slate-700 border-slate-300">🏔️ 경치 & 자연</button>
          <button type="button" data-style="로컬체험" class="style-tag px-3 py-1.5 rounded-full border text-xs font-medium bg-white text-slate-700 border-slate-300">🏘️ 로컬 탐방</button>
          <button type="button" data-style="운동/액티비티" class="style-tag px-3 py-1.5 rounded-full border text-xs font-medium bg-white text-slate-700 border-slate-300">🏃 운동 & 액티비티</button>
          <button type="button" data-style="여유/휴식" class="style-tag px-3 py-1.5 rounded-full border text-xs font-medium bg-white text-slate-700 border-slate-300">☕ 힐링 & 여유</button>
        </div>
      </div>

      <button id="generateBtn" onclick="fetchAIItinerary()" class="w-full bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i> AI 시간대별 맞춤 코스 짜기
      </button>
    </section>

    <!-- 로딩 스피너 -->
    <div id="loading" class="hidden glass-card p-8 rounded-2xl text-center">
      <i class="fa-solid fa-spinner fa-spin text-4xl text-teal-600 mb-3"></i>
      <p class="text-sm font-bold text-slate-800">예산 안에서 최적의 시간대별 코스를 구성 중입니다...</p>
    </div>

    <!-- 예산 안내 박스 -->
    <div id="budgetWarningBox" class="hidden glass-card p-5 rounded-2xl border-2 border-rose-400 bg-rose-50/95 text-xs text-rose-900 space-y-2"></div>

    <!-- 지도 섹션 -->
    <section class="glass-card p-6 rounded-2xl shadow-xl border border-white/40">
      <h2 class="text-lg font-bold mb-3 text-slate-900 border-b pb-2"><i class="fa-solid fa-map-location-dot mr-2 text-teal-600"></i>2. 실시간 동선 지도 (넓은 범위 보기)</h2>
      <div id="map"></div>
    </section>

    <!-- AI 추천 장소 및 제어 버튼 -->
    <section id="recommendationSection" class="glass-card p-6 rounded-2xl shadow-xl border border-white/40 hidden">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 pb-2 border-b gap-3">
        <h2 class="text-lg font-bold text-slate-900"><i class="fa-solid fa-list-check mr-2 text-teal-600"></i>3. AI 추천 장소 리스트</h2>
        
        <div class="flex flex-wrap gap-2">
          <button onclick="toggleSelectAll()" class="px-2.5 py-1 bg-white hover:bg-slate-100 text-slate-700 text-xs font-semibold rounded border shadow-sm">전체 선택</button>
          <button onclick="deleteChecked()" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold rounded border border-rose-200">선택 삭제</button>
          <button onclick="regenerateChecked()" class="px-2.5 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 text-xs font-semibold rounded border border-amber-200">다시 찾기</button>
          <button onclick="confirmPlaces()" class="px-3 py-1 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded shadow">시간대별 일정 확정</button>
        </div>
      </div>

      <div id="placeListContainer" class="space-y-3"></div>
    </section>

    <!-- 날짜별 최종 일정표 & 예산 내역 -->
    <section id="finalScheduleSection" class="glass-card p-6 rounded-2xl shadow-xl border border-white/40 hidden">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 border-b pb-3 gap-3">
        <div>
          <h2 class="text-xl font-bold text-slate-900"><i class="fa-solid fa-calendar-days mr-2 text-teal-600"></i>4. 시간대별 상세 확정 일정표</h2>
          <div id="totalBudgetSummary" class="mt-1 text-xs text-teal-800 font-bold bg-teal-50 px-2.5 py-1 rounded inline-block border border-teal-200"></div>
        </div>

        <div class="flex flex-wrap gap-2">
          <button onclick="shareKakao()" class="px-3 py-1.5 bg-yellow-400 hover:bg-yellow-500 text-slate-900 text-xs font-bold rounded shadow-sm">링크 공유</button>
          <button onclick="shareEmail()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold rounded shadow-sm">메일 전송</button>
          <button onclick="downloadAsImage()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded shadow-sm">이미지 저장</button>
        </div>
      </div>

      <div id="downloadArea" class="p-4 bg-white/90 rounded-xl space-y-4">
        <div id="dayByDaySchedule" class="space-y-6"></div>
      </div>
    </section>

    <!-- 특이사항/차박 요청 -->
    <section id="customRequestSection" class="glass-card p-6 rounded-2xl shadow-xl border border-white/40 hidden">
      <h2 class="text-md font-bold mb-1 text-slate-900"><i class="fa-regular fa-comment-dots mr-2 text-teal-600"></i>5. 추가 요청사항 반영 (선택)</h2>
      <textarea id="customRequestText" rows="2" class="w-full border rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-teal-500 outline-none mb-2 bg-white" placeholder="예: 2일차 밤에는 차박을 하고 싶어요 등"></textarea>
      <button onclick="fetchAIItinerary()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 rounded text-xs transition">
        요청 반영해서 재검색
      </button>
    </section>

    <!-- 준비물 체크리스트 -->
    <section id="packingListSection" class="glass-card p-6 rounded-2xl shadow-xl border border-white/40 hidden">
      <h2 class="text-md font-bold mb-3 text-slate-900 border-b pb-2"><i class="fa-solid fa-boxes-packing mr-2 text-teal-600"></i>6. 여행 필수 준비물 체크리스트</h2>
      <div class="flex gap-2 mb-4">
        <input type="text" id="newPackingItem" class="flex-1 border rounded p-2 text-xs focus:ring-2 focus:ring-teal-500 outline-none bg-white" placeholder="추가 준비물 입력">
        <button onclick="addCustomPackingItem()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold px-4 py-2 rounded">추가</button>
      </div>
      <div id="packingListContainer" class="grid grid-cols-2 md:grid-cols-3 gap-3 text-xs"></div>
    </section>

  </main>

  <script>
    // 하드코딩된 API Key (개인정보 보호)
    const FIXED_API_KEY = "AQ.Ab8RN6K3nkgnYje2mSpkemDglSMq3jMwdZ2-dEN1HGPxS_Dtng";

    let map;
    let markers = [];
    let selectedStyles = [];
    let destinationList = [];
    let generatedPlaces = [];
    let packingItems = ["여권/신분증", "보조배터리/충전기", "환전 카드/현금", "비상약", "세면도구", "우산/우비", "운동화/편한 신발"];
    let allSelectedState = false;

    // OpenStreetMap 초기화 및 로컬스토리지 복원
    function initApp() {
      map = L.map('map').setView([37.5665, 126.9780], 9);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      loadFromLocalStorage();
    }
    window.onload = initApp;

    // 로컬스토리지 저장 및 불러오기 (개인 앱 기록 유지)
    function saveToLocalStorage() {
      const data = {
        startLocation: document.getElementById('startLocation').value,
        totalBudget: document.getElementById('totalBudget').value,
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        travelers: document.getElementById('travelers').value,
        destinationList,
        selectedStyles,
        generatedPlaces,
        packingItems,
        customReq: document.getElementById('customRequestText').value
      };
      localStorage.setItem('ai_travel_planner_data', JSON.stringify(data));
    }

    function loadFromLocalStorage() {
      const saved = localStorage.getItem('ai_travel_planner_data');
      if(!saved) return;
      try {
        const data = JSON.parse(saved);
        if(data.startLocation) document.getElementById('startLocation').value = data.startLocation;
        if(data.totalBudget) document.getElementById('totalBudget').value = data.totalBudget;
        if(data.startDate) document.getElementById('startDate').value = data.startDate;
        if(data.endDate) document.getElementById('endDate').value = data.endDate;
        if(data.travelers) {
          document.getElementById('travelers').value = data.travelers;
          document.getElementById('travelerCountText').innerText = data.travelers + ' 명';
        }
        if(data.destinationList) {
          destinationList = data.destinationList;
          renderDestinationTags();
        }
        if(data.selectedStyles) {
          selectedStyles = data.selectedStyles;
          document.querySelectorAll('.style-tag').forEach(tag => {
            if(selectedStyles.includes(tag.dataset.style)) {
              tag.classList.remove('bg-white', 'text-slate-700');
              tag.classList.add('bg-teal-600', 'text-white');
            }
          });
        }
        if(data.generatedPlaces && data.generatedPlaces.length > 0) {
          generatedPlaces = data.generatedPlaces;
          document.getElementById('recommendationSection').classList.remove('hidden');
          document.getElementById('customRequestSection').classList.remove('hidden');
          renderPlaceList();
          updateMapMarkers(generatedPlaces);
        }
        if(data.packingItems) {
          packingItems = data.packingItems;
          renderPackingList();
        }
        if(data.customReq) document.getElementById('customRequestText').value = data.customReq;
      } catch(e) {
        console.error(e);
      }
    }

    // 여행지 엔터 태그 추가 및 삭제
    function addDestination() {
      const input = document.getElementById('destinationInput');
      const val = input.value.trim();
      if(val && !destinationList.includes(val)) {
        destinationList.push(val);
        input.value = '';
        renderDestinationTags();
        saveToLocalStorage();
      }
    }

    function removeDestination(index) {
      destinationList.splice(index, 1);
      renderDestinationTags();
      saveToLocalStorage();
    }

    function renderDestinationTags() {
      const container = document.getElementById('destinationTags');
      container.innerHTML = destinationList.map((dest, i) => `
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-teal-100 text-teal-800 text-xs font-bold shadow-sm">
          ${dest}
          <button type="button" onclick="removeDestination(${i})" class="text-teal-600 hover:text-teal-900 font-extrabold ml-1">×</button>
        </span>
      `).join('');
    }

    // 스타일 태그 선택
    document.querySelectorAll('.style-tag').forEach(tag => {
      tag.addEventListener('click', function() {
        const style = this.dataset.style;
        if (selectedStyles.includes(style)) {
          selectedStyles = selectedStyles.filter(s => s !== style);
          this.classList.remove('bg-teal-600', 'text-white');
          this.classList.add('bg-white', 'text-slate-700');
        } else {
          selectedStyles.push(style);
          this.classList.remove('bg-white', 'text-slate-700');
          this.classList.add('bg-teal-600', 'text-white');
        }
        saveToLocalStorage();
      });
    });

    // 실시간 Gemini AI 통신 (gemini-3.6-flash 및 시간대별 계획 요청)
    async function fetchAIItinerary() {
      const startLoc = document.getElementById('startLocation').value.trim();
      if(!startLoc) {
        alert("출발지를 입력해 주세요.");
        return;
      }

      if(destinationList.length === 0) {
        alert("최소 하나 이상의 도착 여행지를 입력 후 Enter를 눌러 추가해 주세요.");
        return;
      }

      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const totalBudget = parseInt(document.getElementById('totalBudget').value) || 0;
      const travelers = document.getElementById('travelers').value;
      const customReq = document.getElementById('customRequestText').value;

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('budgetWarningBox').classList.add('hidden');

      const prompt = `
        출발지: ${startLoc}
        도착 여행지 목록: ${destinationList.join(', ')}
        일정: ${startDate} ~ ${endDate}
        인원: ${travelers}명
        사용자 총 예산: ${totalBudget}원
        선호 스타일: ${selectedStyles.join(', ')}
        추가 요청: ${customReq}

        [지침]
        1. 예산은 웬만하면 사용자 총 예산(${totalBudget}원) 범위 내에서 맞출 수 있도록 현실적인 코스를 짜주세요. 터무니없이 부족하여 아예 불가능한 경우에만 "isPossible": false로 하고 대안을 제시해주세요.
        2. 각 장소마다 반드시 구체적인 시간대(예: "09:00 - 11:00", "12:30 - 14:00" 등)를 지정해주세요.
        3. 실제 존재하는 팩트 기반 장소로만 JSON 데이터를 생성하고 모든 비용은 대한민국 원(KRW) 기준입니다.
        4. 어떠한 마크다운/설명 없이 오직 아래 순수 JSON 포맷으로만 응답하세요.

        {
          "isPossible": true,
          "message": "",
          "minRequiredBudget": 0,
          "recommendedAlternatives": [],
          "places": [
            {
              "id": 1,
              "day": 1,
              "timeSlot": "09:00 - 11:00",
              "type": "attraction 또는 restaurant 또는 accommodation",
              "category": "명소 또는 식당 또는 숙소",
              "name": "실제 장소명",
              "lat": 위도(숫자),
              "lng": 경도(숫자),
              "menu": "대표메뉴",
              "atmosphere": "분위기/웨이팅",
              "mustDo": "필수 활동",
              "pros": "숙소 장점",
              "cons": "숙소 단점",
              "reason": "선택 이유",
              "cost": 1인당예상비용(원 단위 숫자만)
            }
          ]
        }
      `;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${FIXED_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        if(data.error) throw new Error(data.error.message);

        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/
