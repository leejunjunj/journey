<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 여정 - 스마트 여행 플래너</title>
  
  <!-- 모바일 홈 화면 앱(PWA) 아이콘 & 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI 여정">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/201/201623.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/201/201623.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- FontAwesome 아이콘 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      background: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.8)), 
                  url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    #map { height: 380px; width: 100%; border-radius: 0.75rem; z-index: 10; }
  </style>
</head>
<body class="text-slate-800 min-h-screen pb-16">

  <!-- 헤더 -->
  <header class="py-6 px-4 text-center text-white shadow-md mb-4">
    <div class="max-w-4xl mx-auto flex justify-center items-center gap-3">
      <img src="https://cdn-icons-png.flaticon.com/512/201/201623.png" class="w-10 h-10 drop-shadow-md" alt="앱 아이콘">
      <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight drop-shadow-md">AI 스마트 여정 플래너</h1>
    </div>
    <p class="text-emerald-200 text-xs md:text-sm mt-1 drop-shadow">실시간 Gemini AI 기반 팩트 코스 및 원화 예산 검증</p>
  </header>

  <main class="max-w-4xl mx-auto px-4 space-y-6">

    <!-- Gemini API Key 입력 섹션 -->
    <section class="glass-card p-4 rounded-2xl shadow-xl border border-amber-300 bg-amber-50/90">
      <div class="flex items-center gap-2 mb-2">
        <i class="fa-solid fa-key text-amber-600"></i>
        <h3 class="text-xs font-bold text-amber-900">Gemini AI API Key 설정</h3>
      </div>
      <input type="password" id="geminiApiKey" class="w-full border border-amber-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-amber-500 outline-none bg-white" placeholder="Google AI Studio에서 발급받은 Gemini API Key를 입력하세요">
      <p class="text-[11px] text-amber-700 mt-1">* 실시간 팩트 코스 생성 및 원화 예산 판별에 API 키가 사용됩니다.</p>
    </section>

    <!-- 1. 여행 정보 입력 -->
    <section class="glass-card p-6 rounded-2xl shadow-xl border border-white/40 space-y-4">
      <h2 class="text-lg font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
        <i class="fa-solid fa-compass text-teal-600"></i>1. 여행 기본 정보 & 예산 설정
      </h2>
      
      <!-- 날짜, 예산 금액 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-700">여행 일정</label>
          <div class="flex items-center gap-1 text-xs">
            <input type="date" id="startDate" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none bg-white">
            <span>~</span>
            <input type="date" id="endDate" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none bg-white">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-700">총 보유 예산 (원)</label>
          <input type="number" id="totalBudget" step="10000" class="w-full border rounded-lg p-2 text-xs focus:ring-2 focus:ring-teal-500 outline-none bg-white" placeholder="예: 1500000 (원 단위 입력)">
        </div>
      </div>

      <!-- 인원 수 슬라이더 -->
      <div>
        <div class="flex justify-between text-xs font-semibold mb-1 text-slate-700">
          <span>여행 인원 수</span>
          <span class="text-teal-600 font-bold" id="travelerCountText">2 명</span>
        </div>
        <input type="range" id="travelers" min="1" max="20" value="2" class="w-full accent-teal-600 cursor-pointer" oninput="document.getElementById('travelerCountText').innerText = this.value + ' 명'">
      </div>

      <!-- 여행지 엔터 태그 추가 & 개별 삭제 -->
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-700">여행지 (도시/국가 적고 Enter 누르면 추가)</label>
        <div class="flex gap-2">
          <input type="text" id="destinationInput" class="flex-1 border rounded-lg p-2 text-xs focus:ring-2 focus:ring-teal-500 outline-none bg-white" placeholder="예: 도쿄 (입력 후 Enter)" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); addDestination(); }">
          <button type="button" onclick="addDestination()" class="bg-teal-600 text-white text-xs px-3 py-2 rounded-lg font-bold">추가</button>
        </div>
        <!-- 추가된 여행지 태그 영역 -->
        <div id="destinationTags" class="flex flex-wrap gap-2 mt-2"></div>
      </div>

      <!-- 여행 스타일 선택 -->
      <div>
        <label class="block text-xs font-semibold mb-2 text-slate-700">선호 스타일 (다중 선택)</label>
        <div class="flex flex-wrap gap-2" id="styleTags">
          <button type="button" data-style="식도락" class="style-tag px-3 py-1.5 rounded-full border text-xs font-medium bg-white text-slate-700 border-slate-300">🍜 식도락</button>
          <button type="button" data-style="경치/자연" class="style-tag px-3 py-1.5 rounded-full border text-xs font-medium bg-white text-slate-700 border-slate-300">🏔️ 경치 & 자연</button>
          <button type="button" data-style="로컬체험" class="style-tag px-3 py-1.5 rounded-full border text-xs font-medium bg-white text-slate-700 border-slate-300">🏘️ 로컬 탐방</button>
          <button type="button" data-style="운동/액티비티" class="style-tag px-3 py-1.5 rounded-full border text-xs font-medium bg-white text-slate-700 border-slate-300">🏃 운동 & 액티비티</button>
          <button type="button" data-style="여유/휴식" class="style-tag px-3 py-1.5 rounded-full border text-xs font-medium bg-white text-slate-700 border-slate-300">☕ 힐링 & 여유</button>
        </div>
      </div>

      <button id="generateBtn" onclick="fetchAIItinerary()" class="w-full bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i> AI 실시간 코스 짜기
      </button>
    </section>

    <!-- 로딩 스피너 -->
    <div id="loading" class="hidden glass-card p-8 rounded-2xl text-center">
      <i class="fa-solid fa-spinner fa-spin text-4xl text-teal-600 mb-3"></i>
      <p class="text-sm font-bold text-slate-800">Gemini AI가 원화 예산 타당성을 확인하고 실시간 계획을 작성 중입니다...</p>
    </div>

    <!-- 예산 경고 및 추천 박스 -->
    <div id="budgetWarningBox" class="hidden glass-card p-5 rounded-2xl border-2 border-rose-400 bg-rose-50/95 text-xs text-rose-900 space-y-2"></div>

    <!-- 지도 섹션 -->
    <section class="glass-card p-6 rounded-2xl shadow-xl border border-white/40">
      <h2 class="text-lg font-bold mb-3 text-slate-900 border-b pb-2"><i class="fa-solid fa-map-location-dot mr-2 text-teal-600"></i>2. 실시간 지도 핀 위치 (Leaflet Engine)</h2>
      <div id="map"></div>
    </section>

    <!-- AI 추천 장소 및 제어 버튼 -->
    <section id="recommendationSection" class="glass-card p-6 rounded-2xl shadow-xl border border-white/40 hidden">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 pb-2 border-b gap-3">
        <h2 class="text-lg font-bold text-slate-900"><i class="fa-solid fa-list-check mr-2 text-teal-600"></i>3. AI 추천 장소 리스트</h2>
        
        <div class="flex flex-wrap gap-2">
          <button onclick="toggleSelectAll()" class="px-2.5 py-1 bg-white hover:bg-slate-100 text-slate-700 text-xs font-semibold rounded border shadow-sm">전체 선택</button>
          <button onclick="deleteChecked()" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold rounded border border-rose-200">선택 삭제</button>
          <button onclick="regenerateChecked()" class="px-2.5 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 text-xs font-semibold rounded border border-amber-200">다시 찾기</button>
          <button onclick="confirmPlaces()" class="px-3 py-1 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded shadow">여행지 확정</button>
        </div>
      </div>

      <div id="placeListContainer" class="space-y-3"></div>
    </section>

    <!-- 날짜별 최종 일정표 & 예산 내역 -->
    <section id="finalScheduleSection" class="glass-card p-6 rounded-2xl shadow-xl border border-white/40 hidden">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 border-b pb-3 gap-3">
        <div>
          <h2 class="text-xl font-bold text-slate-900"><i class="fa-solid fa-calendar-days mr-2 text-teal-600"></i>6. 날짜별 확정 일정표</h2>
          <div id="totalBudgetSummary" class="mt-1 text-xs text-teal-800 font-bold bg-teal-50 px-2.5 py-1 rounded inline-block border border-teal-200"></div>
        </div>

        <div class="flex flex-wrap gap-2">
          <button onclick="shareKakao()" class="px-3 py-1.5 bg-yellow-400 hover:bg-yellow-500 text-slate-900 text-xs font-bold rounded shadow-sm">카톡 공유</button>
          <button onclick="shareEmail()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold rounded shadow-sm">메일 전송</button>
          <button onclick="downloadAsImage()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded shadow-sm">이미지 저장</button>
        </div>
      </div>

      <div id="downloadArea" class="p-4 bg-white/80 rounded-xl">
        <div id="dayByDaySchedule" class="space-y-6"></div>
      </div>
    </section>

    <!-- 특이사항/차박 요청 -->
    <section id="customRequestSection" class="glass-card p-6 rounded-2xl shadow-xl border border-white/40 hidden">
      <h2 class="text-md font-bold mb-1 text-slate-900"><i class="fa-regular fa-comment-dots mr-2 text-teal-600"></i>7. 추가 요청사항 반영 (선택)</h2>
      <textarea id="customRequestText" rows="2" class="w-full border rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-teal-500 outline-none mb-2 bg-white" placeholder="예: 2일차 밤에는 차박을 하고 싶어요 등"></textarea>
      <button onclick="fetchAIItinerary()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 rounded text-xs transition">
        요청 반영해서 AI 재검색
      </button>
    </section>

    <!-- 준비물 체크리스트 -->
    <section id="packingListSection" class="glass-card p-6 rounded-2xl shadow-xl border border-white/40 hidden">
      <h2 class="text-md font-bold mb-3 text-slate-900 border-b pb-2"><i class="fa-solid fa-boxes-packing mr-2 text-teal-600"></i>여행 필수 준비물 체크리스트</h2>
      <div class="flex gap-2 mb-4">
        <input type="text" id="newPackingItem" class="flex-1 border rounded p-2 text-xs focus:ring-2 focus:ring-teal-500 outline-none bg-white" placeholder="추가 준비물 입력">
        <button onclick="addCustomPackingItem()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold px-4 py-2 rounded">추가</button>
      </div>
      <div id="packingListContainer" class="grid grid-cols-2 md:grid-cols-3 gap-3 text-xs"></div>
    </section>

  </main>

  <script>
    let map;
    let markers = [];
    let selectedStyles = [];
    let destinationList = [];
    let generatedPlaces = [];
    let allSelectedState = false;

    // OpenStreetMap 초기화
    function initMap() {
      map = L.map('map').setView([37.5665, 126.9780], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);
    }
    window.onload = initMap;

    // 여행지 엔터 태그 추가 및 삭제
    function addDestination() {
      const input = document.getElementById('destinationInput');
      const val = input.value.trim();
      if(val && !destinationList.includes(val)) {
        destinationList.push(val);
        input.value = '';
        renderDestinationTags();
      }
    }

    function removeDestination(index) {
      destinationList.splice(index, 1);
      renderDestinationTags();
    }

    function renderDestinationTags() {
      const container = document.getElementById('destinationTags');
      container.innerHTML = destinationList.map((dest, i) => `
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-teal-100 text-teal-800 text-xs font-bold shadow-sm">
          ${dest}
          <button type="button" onclick="removeDestination(${i})" class="text-teal-600 hover:text-teal-900 font-extrabold ml-1">×</button>
        </span>
      `).join('');
    }

    // 스타일 태그 선택
    document.querySelectorAll('.style-tag').forEach(tag => {
      tag.addEventListener('click', function() {
        const style = this.dataset.style;
        if (selectedStyles.includes(style)) {
          selectedStyles = selectedStyles.filter(s => s !== style);
          this.classList.remove('bg-teal-600', 'text-white');
          this.classList.add('bg-white', 'text-slate-700');
        } else {
          selectedStyles.push(style);
          this.classList.remove('bg-white', 'text-slate-700');
          this.classList.add('bg-teal-600', 'text-white');
        }
      });
    });

    // 실시간 Gemini AI 통신 (최신 gemini-3.6-flash 모델로 수정 완료)
    async function fetchAIItinerary() {
      const apiKey = document.getElementById('geminiApiKey').value.trim();
      if(!apiKey) {
        alert("상단에 Gemini API Key를 입력해 주세요.");
        return;
      }

      if(destinationList.length === 0) {
        alert("최소 하나 이상의 여행지를 입력 후 Enter를 눌러 추가해 주세요.");
        return;
      }

      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const totalBudget = parseInt(document.getElementById('totalBudget').value) || 0;
      const travelers = document.getElementById('travelers').value;
      const customReq = document.getElementById('customRequestText').value;

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('budgetWarningBox').classList.add('hidden');

      const prompt = `
        여행지 목록: ${destinationList.join(', ')}
        일정: ${startDate} ~ ${endDate}
        인원: ${travelers}명
        사용자 총 예산: ${totalBudget}원
        선호 스타일: ${selectedStyles.join(', ')}
        추가 요청: ${customReq}

        [검증 및 지침]
        1. 만약 입력된 총 예산(${totalBudget}원)이 여행지 항공/교통/숙박 대비 현저히 부족할 경우 (예: 미국/유럽에 비행기표도 못 살 예산일 경우):
           - "isPossible": false 로 설정하고
           - "minRequiredBudget": 최소 필요한 예상 금액(대한민국 원 단위 숫자)
           - "recommendedAlternatives": ["예산에 맞는 추천 여행지1", "추천 여행지2"]
           - "message": 사유 설명 작성

        2. 예산이 충분한 경우:
           - "isPossible": true
           - 실제 존재하는 팩트 기반 장소로만 JSON 데이터 생성. 모든 비용은 대한민국 원(KRW) 기준으로 계산.
           - 어떠한 마크다운/설명 없이 오직 아래 순수 JSON 포맷으로만 응답해.

        {
          "isPossible": true 또 false,
          "message": "예산 충분/부족 설명",
          "minRequiredBudget": 0,
          "recommendedAlternatives": [],
          "places": [
            {
              "id": 1,
              "day": 1,
              "type": "restaurant 또는 attraction 또는 accommodation",
              "category": "식당 또는 명소 또는 숙소",
              "name": "실제 장소명",
              "lat": 위도(숫자),
              "lng": 경도(숫자),
              "menu": "대표메뉴",
              "atmosphere": "분위기/웨이팅",
              "mustDo": "필수 활동",
              "pros": "숙소 장점",
              "cons": "숙소 단점",
              "reason": "고른 이유 (팩트 기반)",
              "cost": 1인당예상비용(원 단위 숫자만)
            }
          ]
        }
      `;

      try {
        // 최신 버전인 gemini-3.6-flash 호환 적용
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        if(data.error) throw new Error(data.error.message);

        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();

        const result = JSON.parse(rawText);
        document.getElementById('loading').classList.add('hidden');

        // 예산 부족 시 처리
        if (!result.isPossible) {
          const warningBox = document.getElementById('budgetWarningBox');
          warningBox.innerHTML = `
            <h3 class="font-bold text-sm text-rose-800"><i class="fa-solid fa-triangle-exclamation mr-1"></i> 예산 부족 안내</h3>
            <p>${result.message}</p>
            <p class="font-bold text-teal-800">💡 최소 필요 예산: 약 ₩${(result.minRequiredBudget || 0).toLocaleString()}원</p>
            ${result.recommendedAlternatives && result.recommendedAlternatives.length > 0 ? `<p class="mt-1"><b>대신 추천하는 여행지:</b> ${result.recommendedAlternatives.join(', ')}</p>` : ''}
          `;
          warningBox.classList.remove('hidden');
          return;
        }

        generatedPlaces = result.places || [];
        
        document.getElementById('recommendationSection').classList.remove('hidden');
        document.getElementById('customRequestSection').classList.remove('hidden');

        renderPlaceList();
        updateMapMarkers(generatedPlaces);

      } catch (err) {
        console.error(err);
        alert("AI 통신 실패: Gemini API Key를 확인해 주세요.\n오류내용: " + err.message);
        document.getElementById('loading').classList.add('hidden');
      }
    }

    // 지도 핀 업데이트
    function updateMapMarkers(places) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      const bounds = [];

      places.forEach(place => {
        if(place.lat && place.lng) {
          const marker = L.marker([place.lat, place.lng]).addTo(map)
            .bindPopup(`<b>${place.name}</b><br>${place.category}`);
          markers.push(marker);
          bounds.push([place.lat, place.lng]);
        }
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds);
      }
    }

    function renderPlaceList() {
      const container = document.getElementById('placeListContainer');
      container.innerHTML = '';

      generatedPlaces.forEach((place) => {
        const card = document.createElement('div');
        card.className = "p-3.5 rounded-xl border border-slate-200 bg-white shadow-sm flex items-start gap-3 text-xs";

        let detailHTML = '';
        if(place.type === 'restaurant') {
          detailHTML = `<p class="text-slate-600 mt-1"><b>대표메뉴:</b> ${place.menu || '대표 메뉴'} | <b>분위기/웨이팅:</b> ${place.atmosphere || '보통'}</p><p class="text-teal-700 font-medium mt-0.5"><i class="fa-solid fa-thumbs-up mr-1"></i><b>고른 이유:</b> ${place.reason}</p>`;
        } else if(place.type === 'attraction') {
          detailHTML = `<p class="text-slate-600 mt-1"><b>추천 활동:</b> ${place.mustDo || '관람'}</p><p class="text-teal-700 font-medium mt-0.5"><i class="fa-solid fa-compass mr-1"></i><b>가야 하는 이유:</b> ${place.reason}</p>`;
        } else if(place.type === 'accommodation') {
          detailHTML = `<p class="text-emerald-700 mt-1"><b>장점:</b> ${place.pros || '편리함'}</p><p class="text-rose-600"><b>단점:</b> ${place.cons || '없음'}</p>`;
        }

        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name)}`;

        card.innerHTML = `
          <input type="checkbox" class="mt-1 w-4 h-4 cursor-pointer" ${place.checked ? 'checked' : ''} onchange="toggleCheck(${place.id})">
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <span class="font-bold px-2 py-0.5 rounded ${place.type==='restaurant'?'bg-amber-100 text-amber-800':place.type==='attraction'?'bg-blue-100 text-blue-800':'bg-purple-100 text-purple-800'}">${place.category}</span>
              <strong class="text-sm text-slate-800">${place.name}</strong>
              <span class="text-slate-500 ml-auto">₩${(place.cost||0).toLocaleString()}원</span>
              <a href="${mapUrl}" target="_blank" class="text-teal-600 hover:underline"><i class="fa-solid fa-arrow-up-right-from-square"></i> 지도</a>
            </div>
            ${detailHTML}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleCheck(id) {
      const item = generatedPlaces.find(p => p.id === id);
      if(item) item.checked = !item.checked;
    }

    function toggleSelectAll() {
      allSelectedState = !allSelectedState;
      generatedPlaces.forEach(p => p.checked = allSelectedState);
      renderPlaceList();
    }

    function deleteChecked() {
      generatedPlaces = generatedPlaces.filter(p => !p.checked);
      renderPlaceList();
      updateMapMarkers(generatedPlaces);
    }

    function regenerateChecked() {
      fetchAIItinerary();
    }

    function confirmPlaces() {
      const finalSection = document.getElementById('finalScheduleSection');
      const container = document.getElementById('dayByDaySchedule');
      const packingSection = document.getElementById('packingListSection');
      
      finalSection.classList.remove('hidden');
      packingSection.classList.remove('hidden');
      container.innerHTML = '';

      const travelers = parseInt(document.getElementById('travelers').value) || 1;
      let totalExpense = 0;

      const grouped = {};
      generatedPlaces.forEach(p => {
        const day = p.day || 1;
        if(!grouped[day]) grouped[day] = [];
        grouped[day].push(p);
      });

      Object.keys(grouped).forEach(day => {
        const dayBox = document.createElement('div');
        dayBox.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-sm";

        let dayCost = 0, foodCost = 0, transCost = 15000, stayCost = 0, etcCost = 0;

        let itemsHTML = grouped[day].map(item => {
          dayCost += (item.cost || 0);
          if(item.type === 'restaurant') foodCost += item.cost;
          else if(item.type === 'accommodation') stayCost += item.cost;
          else etcCost += item.cost;

          return `
            <div class="py-1.5 border-b last:border-b-0 flex justify-between items-center text-xs">
              <div>
                <span class="font-semibold px-1.5 py-0.5 rounded bg-slate-100 mr-2">${item.category}</span>
                <strong class="text-slate-800">${item.name}</strong>
              </div>
              <span class="text-slate-500">₩${(item.cost||0).toLocaleString()}원</span>
            </div>
          `;
        }).join('');

        dayCost += transCost;
        totalExpense += dayCost;

        dayBox.innerHTML = `
          <div class="flex justify-between items-center mb-2 pb-1 border-b">
            <h3 class="font-bold text-teal-700 text-sm"><i class="fa-regular fa-calendar-check mr-1"></i> DAY ${day}</h3>
            <span class="text-xs font-bold text-slate-700">1일 예산: 약 ₩${dayCost.toLocaleString()}원</span>
          </div>
          <div class="text-xs text-slate-500 bg-slate-50 p-2 rounded mb-2 grid grid-cols-4 gap-1 text-center">
            <div>🍚 식비: ₩${foodCost.toLocaleString()}원</div>
            <div>🚌 교통: ₩${transCost.toLocaleString()}원</div>
            <div>🏨 숙박: ₩${stayCost.toLocaleString()}원</div>
            <div>🎟️ 기타: ₩${etcCost.toLocaleString()}원</div>
          </div>
          <div class="space-y-1">${itemsHTML}</div>
        `;
        container.appendChild(dayBox);
      });

      const grandTotal = totalExpense * travelers;
      document.getElementById('totalBudgetSummary').innerHTML = `총 예상 소요 비용 (${travelers}명): 약 ₩${grandTotal.toLocaleString()}원 (1인당 ₩${totalExpense.toLocaleString()}원)`;

      renderDefaultPackingList();
      window.scrollTo({ top: finalSection.offsetTop - 20, behavior: 'smooth' });
    }

    function shareKakao() {
      navigator.clipboard.writeText(window.location.href);
      alert("링크가 복사되었습니다! 대화창에 공유해 보세요.");
    }

    function shareEmail() {
      window.location.href = `mailto:?subject=${encodeURIComponent("여행 일정 공유")}&body=${encodeURIComponent("일정표를 확인해 보세요!")}`;
    }

    function downloadAsImage() {
      html2canvas(document.getElementById('downloadArea')).then(canvas => {
        const link = document.createElement('a');
        link.download = 'travel-plan.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    const defaultPacking = ["여권/신분증", "보조배터리/충전기", "환전 카드/현금", "비상약", "세면도구", "우산/우비", "운동화/편한 신발"];
    function renderDefaultPackingList() {
      const container = document.getElementById('packingListContainer');
      container.innerHTML = '';
      defaultPacking.forEach(item => addPackingCheckbox(item));
    }

    function addPackingCheckbox(label) {
      const container = document.getElementById('packingListContainer');
      const div = document.createElement('div');
      div.className = "flex items-center gap-2 p-2 rounded border bg-white shadow-sm";
      div.innerHTML = `<input type="checkbox" class="w-4 h-4 cursor-pointer"><span class="text-slate-700">${label}</span>`;
      container.appendChild(div);
    }

    function addCustomPackingItem() {
      const input = document.getElementById('newPackingItem');
      if(input.value.trim()) {
        addPackingCheckbox(input.value.trim());
        input.value = '';
      }
    }
  </script>
</body>
</html>
